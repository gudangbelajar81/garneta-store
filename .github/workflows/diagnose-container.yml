name: Diagnosa Container VPS

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Cek Container & Logs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Diagnosa via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 300s
          script: |
            echo "=== Container status ==="
            docker ps -a --format '{{.Names}} | {{.Image}} | {{.Status}}' | grep qy8o93x
            echo ""
            echo "=== Apakah port 3000 merespons sekarang? ==="
            curl -s -o /dev/null -w "localhost:3000 -> HTTP %{http_code}\n" http://localhost:3000 || echo "tidak merespons"
            echo ""
            echo "=== Log container (50 baris terakhir) ==="
            docker logs qy8o93x6nlmon1xo7lrnpf3r-132135139387 --tail 50 2>&1 || echo "tidak bisa baca log"
            echo ""
            echo "=== Images tersedia ==="
            docker images | grep qy8o93x
