name: Deploy Garneta Store ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy via SSH ke Hetzner VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy melalui SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          script_timeout: 600s
          script: |
            set -e
            echo "=== [1/4] Lokasi direktori aplikasi di Coolify ==="
            APP_DIR="/data/coolify/apps/qy8o93x6nlmon1xo7lrnpf3r"
            if [ ! -d "$APP_DIR" ]; then
              # Coba lokasi alternatif
              APP_DIR=$(find /data/coolify/apps -maxdepth 2 -name "qy8o93x6nlmon1xo7lrnpf3r*" -type d 2>/dev/null | head -1)
            fi
            if [ -z "$APP_DIR" ] || [ ! -d "$APP_DIR" ]; then
              echo "❌ Direktori aplikasi tidak ditemukan!"
              ls /data/coolify/apps/ 2>/dev/null || echo "Tidak ada /data/coolify/apps"
              exit 1
            fi
            echo "✅ APP_DIR = $APP_DIR"
            cd "$APP_DIR"

            echo "=== [2/4] Update kode dari GitHub ==="
            git fetch origin main 2>&1 || true
            git reset --hard origin/main 2>&1 || true
            git log --oneline -1

            echo "=== [3/4] Trigger deploy via Coolify lokal ==="
            # Coba dapatkan token dari database Coolify (postgres)
            TOKEN=""
            DB_CONTAINER=$(docker ps --format '{{.Names}}' | grep -i coolify-db | head -1)
            if [ -n "$DB_CONTAINER" ]; then
              TOKEN=$(docker exec "$DB_CONTAINER" psql -U coolify -d coolify -t -A -c "SELECT token FROM personal_access_tokens ORDER BY id LIMIT 1;" 2>/dev/null | head -1)
            fi

            if [ -n "$TOKEN" ]; then
              echo "✅ Token API Coolify ditemukan, trigger deploy..."
              curl -s -X GET "http://localhost:8000/api/v1/deploy?uuid=qy8o93x6nlmon1xo7lrnpf3r" \
                -H "Authorization: Bearer $TOKEN" | head -c 500 || true
              echo ""
            else
              echo "⚠️ Token tidak ditemukan, fallback ke build manual..."
            fi

            echo "=== [4/4] Fallback: build manual jika perlu ==="
            # Cek apakah container masih berjalan dengan image lama
            CONTAINER_ID=$(docker ps --format '{{.ID}} {{.Image}}' | grep "qy8o93x6nlmon1xo7lrnpf3r" | awk '{print $1}' | head -1)
            if [ -n "$CONTAINER_ID" ]; then
              echo "✅ Container berjalan: $CONTAINER_ID"
              # Restart container untuk memuat kode baru (kalau volume mount source)
              docker restart "$CONTAINER_ID" 2>&1 || true
              echo "Container di-restart."
            else
              echo "⚠️ Container tidak ditemukan, coba docker compose..."
              if [ -f "docker-compose.yml" ]; then
                docker compose up -d --build 2>&1 || true
              fi
            fi

            echo "=== DEPLOY SELESAI ==="
