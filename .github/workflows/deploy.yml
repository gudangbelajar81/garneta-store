name: Deploy Garneta Store ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Anti-tabrakan: hanya SATU deploy boleh jalan. Yang baru menunggu giliran.
concurrency:
  group: garneta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy via SSH (Auto-Rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Build & Deploy di VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 1200s
          script: |
            set -e
            APP_DIR="/data/coolify/applications/qy8o93x6nlmon1xo7lrnpf3r"
            IMAGE_NAME="qy8o93x6nlmon1xo7lrnpf3r"
            CONTAINER="qy8o93x6nlmon1xo7lrnpf3r-132135139387"
            BUILD_DIR="/tmp/garneta-build"
            MARKER="kentang"
            PUBLIC_URL="https://toko.alvezadigital.com"
            FAILED=0

            echo "=== [1] Clone source terbaru dari GitHub ==="
            rm -rf "$BUILD_DIR"
            git clone --depth 1 https://github.com/gudangbelajar81/garneta-store "$BUILD_DIR"
            cd "$BUILD_DIR"
            COMMIT=$(git rev-parse HEAD)
            echo "Commit terbaru: $COMMIT"

            echo ""
            echo "=== [2] Catat image lama (untuk rollback) ==="
            cd "$APP_DIR"
            OLD_IMAGE=$(grep "image:" docker-compose.yaml | head -1 | sed "s/.*image: '\(.*\)'.*/\1/")
            echo "Image lama: $OLD_IMAGE"
            cp docker-compose.yaml docker-compose.yaml.bak

            echo ""
            echo "=== [3] Build Docker image baru ==="
            docker build -t "$IMAGE_NAME:$COMMIT" "$BUILD_DIR" 2>&1 | tail -5

            echo ""
            echo "=== [4] Update docker-compose.yaml dengan image baru ==="
            sed -i "s|image: '$IMAGE_NAME:.*'|image: '$IMAGE_NAME:$COMMIT'|" docker-compose.yaml
            grep "image:" docker-compose.yaml

            echo ""
            echo "=== [5] Update SOURCE_COMMIT di .env ==="
            if grep -q "^SOURCE_COMMIT=" .env; then
              sed -i "s|^SOURCE_COMMIT=.*|SOURCE_COMMIT=$COMMIT|" .env
            else
              echo "SOURCE_COMMIT=$COMMIT" >> .env
            fi
            grep "SOURCE_COMMIT" .env

            echo ""
            echo "=== [6] Deploy container baru ==="
            docker compose up -d 2>&1 | tail -10

            echo ""
            echo "=== [7] Health Check: tunggu app siap via LOG CONTAINER (maks 120s) ==="
            # CATATAN: port 3000 TIDAK diexpose ke host (hanya Traefik yang akses).
            # Jadi kita cek LOG container untuk tanda "Server berjalan".
            READY=0
            for i in $(seq 1 40); do
              sleep 3
              STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo "hilang")
              if [ "$STATE" != "running" ]; then
                echo "  percobaan $i: container status = $STATE"
                if [ "$STATE" = "exited" ] || [ "$STATE" = "dead" ]; then
                  echo "  Container mati! Berhenti menunggu."
                  break
                fi
              else
                BOOT=$(docker logs "$CONTAINER" --tail 100 2>&1 | grep -c "Server berjalan" || true)
                if [ "$BOOT" -gt 0 ]; then
                  echo "  percobaan $i: app melaporkan 'Server berjalan' ✅"
                  READY=1
                  break
                fi
              fi
            done

            if [ "$READY" = "0" ]; then
              echo "GAGAL: app tidak siap setelah 120 detik!"
              FAILED=1
              echo "--- Log container (30 baris terakhir) ---"
              docker logs "$CONTAINER" --tail 30 2>&1 || true
            fi

            echo ""
            echo "=== [8] Health Check: verifikasi domain publik ==="
            if [ "$READY" = "1" ]; then
              sleep 3
              PUB=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || true)
              echo "Domain publik: HTTP $PUB"
              if [ "$PUB" != "200" ] && [ "$PUB" != "301" ] && [ "$PUB" != "302" ]; then
                echo "GAGAL: domain publik tidak sehat!"
                FAILED=1
              fi
            fi

            echo ""
            echo "=== [9] Health Check: verifikasi konten penting ==="
            if [ "$READY" = "1" ]; then
              CONTENT=$(curl -s "$PUBLIC_URL" || true)
              COUNT=$(echo "$CONTENT" | grep -c "$MARKER" || true)
              echo "Kemunculan '$MARKER': $COUNT"
              if [ "$COUNT" = "0" ]; then
                echo "GAGAL: konten '$MARKER' tidak ditemukan di domain publik!"
                FAILED=1
              fi
            fi

            echo ""
            echo "=== [10] Finalisasi ==="
            if [ "$FAILED" = "0" ]; then
              echo "DEPLOY SUKSES ✅ (commit $COMMIT)"
              docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | grep qy8o93x
            else
              echo "DEPLOY GAGAL ❌ — MELAKUKAN ROLLBACK OTOMATIS..."
              sed -i "s|image: '$IMAGE_NAME:.*'|image: '$OLD_IMAGE'|" docker-compose.yaml
              echo "Mengembalikan ke image lama: $OLD_IMAGE"
              grep "image:" docker-compose.yaml
              docker compose up -d 2>&1 | tail -5
              echo "Menunggu rollback siap (maks 90s)..."
              RB_OK=0
              for i in $(seq 1 30); do
                sleep 3
                RB_STATE=$(docker inspect -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo "hilang")
                RB_BOOT=$(docker logs "$CONTAINER" --tail 50 2>&1 | grep -c "Server berjalan" || true)
                if [ "$RB_STATE" = "running" ] && [ "$RB_BOOT" -gt 0 ]; then
                  echo "  rollback percobaan $i: app 'Server berjalan' ✅"
                  RB_OK=1
                  break
                fi
                echo "  rollback percobaan $i: state=$RB_STATE boot=$RB_BOOT"
              done
              if [ "$RB_OK" = "1" ]; then
                sleep 3
                RB_PUB=$(curl -s -o /dev/null -w "%{http_code}" "$PUBLIC_URL" || true)
                echo "Domain publik setelah rollback: HTTP $RB_PUB"
                echo "ROLLBACK BERHASIL ✅ — website kembali normal (versi lama)"
                docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | grep qy8o93x
                exit 0
              else
                echo "⚠️ ROLLBACK TIDAK SEMPURNA — PERLU INTERVENSI MANUAL!"
                docker logs "$CONTAINER" --tail 20 2>&1 || true
                exit 1
              fi
            fi
