name: Deploy Garneta Store ke VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Build & Deploy di VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 900s
          script: |
            set -e
            APP_DIR="/data/coolify/applications/qy8o93x6nlmon1xo7lrnpf3r"
            IMAGE_NAME="qy8o93x6nlmon1xo7lrnpf3r"
            BUILD_DIR="/tmp/garneta-build"

            echo "=== [1] Clone source terbaru dari GitHub ==="
            rm -rf "$BUILD_DIR"
            git clone --depth 1 https://github.com/gudangbelajar81/garneta-store "$BUILD_DIR"
            cd "$BUILD_DIR"
            COMMIT=$(git rev-parse HEAD)
            echo "Commit terbaru: $COMMIT"

            echo ""
            echo "=== [2] Build Docker image ==="
            docker build -t "$IMAGE_NAME:$COMMIT" "$BUILD_DIR" 2>&1 | tail -5

            echo ""
            echo "=== [3] Update docker-compose.yaml dengan image baru ==="
            cd "$APP_DIR"
            cp docker-compose.yaml docker-compose.yaml.bak
            sed -i "s|image: '$IMAGE_NAME:.*'|image: '$IMAGE_NAME:$COMMIT'|" docker-compose.yaml
            grep "image:" docker-compose.yaml

            echo ""
            echo "=== [4] Update SOURCE_COMMIT di .env ==="
            if grep -q "^SOURCE_COMMIT=" .env; then
              sed -i "s|^SOURCE_COMMIT=.*|SOURCE_COMMIT=$COMMIT|" .env
            else
              echo "SOURCE_COMMIT=$COMMIT" >> .env
            fi
            grep "SOURCE_COMMIT" .env

            echo ""
            echo "=== [5] Deploy container baru ==="
            docker compose up -d 2>&1 | tail -10

            echo ""
            echo "=== [6] Verifikasi container ==="
            sleep 5
            docker ps --format '{{.Names}} {{.Image}} {{.Status}}' | grep qy8o93x

            echo ""
            echo "=== [7] Verifikasi HTTP local ==="
            curl -s -o /dev/null -w "HTTP %{http_code}" http://localhost:3000 || echo "gagal"

            echo ""
            echo "=== [8] Verifikasi konten kentang ==="
            KENTANG=$(curl -s http://localhost:3000/ | grep -c "kentang\|Kentang" || true)
            echo "Jumlah kemunculan kentang di index: $KENTANG"

            echo ""
            echo "=== [9] Verifikasi via domain publik ==="
            sleep 3
            curl -s -o /dev/null -w "HTTP %{http_code}" https://toko.alvezadigital.com || echo "gagal"
            echo ""
            echo "DEPLOY SELESAI ✅"
