name: Inspect Coolify App Config

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect docker-compose dan Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: 22
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo "=== docker-compose.yaml ==="
            cat /data/coolify/applications/qy8o93x6nlmon1xo7lrnpf3r/docker-compose.yaml 2>&1
            echo ""
            echo "=== .env ==="
            cat /data/coolify/applications/qy8o93x6nlmon1xo7lrnpf3r/.env 2>&1 | sed 's/=.*/=***/' | head -30
            echo ""
            echo "=== Container detail (full) ==="
            docker inspect qy8o93x6nlmon1xo7lrnpf3r-132135139387 --format '{{json .Config.Labels}}' 2>&1 | python3 -m json.tool 2>/dev/null | head -50 || docker inspect qy8o93x6nlmon1xo7lrnpf3r-132135139387 --format '{{json .Config.Labels}}' 2>&1 | head -20
            echo ""
            echo "=== Container env ==="
            docker inspect qy8o93x6nlmon1xo7lrnpf3r-132135139387 --format '{{range .Config.Env}}{{println .}}{{end}}' 2>&1 | sed 's/=.*/=***/' | head -30
            echo ""
            echo "=== Docker images ==="
            docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}}' | grep qy8o93x 2>&1
            echo ""
            echo "=== Git repo di VPS? ==="
            ls -la /tmp/garneta* /root/garneta* 2>/dev/null || echo "belum ada clone"
